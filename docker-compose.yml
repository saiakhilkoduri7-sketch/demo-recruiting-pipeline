services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recruiting_db
      POSTGRES_USER: recruiting
      POSTGRES_PASSWORD: recruiting_local_password
    ports:
      - "5432:5432"
    volumes:
      - recruiting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiting -d recruiting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://recruiting:recruiting_local_password@db:5432/recruiting_db
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  recruiting_postgres_data:
